<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Рельеф</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Рельеф">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--s1:rgba(17,17,20,.84);--s2:#1a1a1d;--s3:#27272b;--ln:#2c2c31;--tx:#ededee;--mu:#8b8b92;--dim:#5d5d64;
  --red:#ff4d4f;--blue:#3d8bff;--yel:#ffc53d;--grn:#2fd27a;--cy:#6cc4ff;
  --fd:"Unbounded","Arial Black",system-ui,sans-serif;
  --fb:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--tx:#ededee}}
:root[data-theme="dark"]{--bg:#000;--tx:#ededee}
html{background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:12px 0 10px;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{font:800 17px/1 var(--fd);letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:20px}
.date{color:var(--mu);font-size:13px;margin-left:auto}
.sync{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.sync.on{background:var(--grn)}
.aibtn{height:32px;padding:0 12px;border-radius:16px;background:var(--s2);border:1px solid var(--ln);font-weight:600;font-size:13px;display:none;align-items:center;gap:6px}
.aibtn.show{display:inline-flex}
.aibtn i{width:7px;height:7px;border-radius:50%;background:var(--cy)}
.scr{display:none}.scr.on{display:block}
h1{font:700 24px/1.15 var(--fd);margin:12px 0 6px}
h2{font:700 17px/1.2 var(--fd);margin:30px 0 12px}
.h3{font-weight:700;font-size:15px;margin:18px 0 8px}
.sub{color:var(--mu);margin:0 0 16px}
.mu{color:var(--mu)}
.blk{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lnk{color:var(--cy);font-weight:600;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;background:var(--tx);color:#000;font-weight:700;font-size:15px}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}
.btn.w{width:100%}
.btn.sm{height:36px;padding:0 14px;border-radius:11px;font-size:13.5px}
.btn:disabled{opacity:.4}
/* сегодня */
.hero{position:relative;width:min(236px,68vw);margin:6px auto 0}
.plate{width:100%;height:auto;display:block}
.hero-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero-c b{font:800 38px/1 var(--fd)}
.hero-c span{color:var(--mu);font-size:12.5px;margin-top:6px;max-width:110px}
.streak{text-align:center;color:var(--mu);margin:8px 0 0;font-size:14px}
.streak b{color:var(--tx)}
.hl{margin-top:14px}
.hr{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--ln)}
.dot{width:22px;height:22px;border-radius:50%;border:4px solid var(--c);flex:none;opacity:.4}
.hr.ok .dot{background:var(--c);opacity:1;box-shadow:inset 0 0 0 3px #000}
.hr .lb{flex:1;min-width:0}
.hr .lb b{display:block;font-weight:600}
.hr .lb small{color:var(--mu);font-size:12.5px}
.tg{width:52px;height:32px;border-radius:16px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#bdbdc2;transition:transform .2s}
.tg.on{background:var(--c)}
.tg.on::after{transform:translateX(20px);background:#fff}
.cnt{display:flex;align-items:center;gap:6px}
.cnt button{width:34px;height:34px;border-radius:50%;background:var(--s3);font-size:19px;line-height:1}
.cnt output{min-width:42px;text-align:center;font:700 14px var(--fd)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.wd{text-align:center}
.wd svg{width:100%;max-width:40px;height:auto}
.wd small{display:block;color:var(--mu);font-size:11.5px}
.wd.today small{color:var(--tx);font-weight:700}
.wcard small{color:var(--mu);font-size:13px}
.wcard>b{display:block;font:700 19px/1.25 var(--fd);margin:4px 0 2px}
.wcard .btn{margin-top:14px}
.bar{margin-top:12px}
.bar .row{font-size:13.5px}
.bar .row span{color:var(--mu)}
.bar i{display:block;height:6px;border-radius:3px;background:var(--s3);margin-top:6px;overflow:hidden}
.bar i::after{content:"";display:block;height:100%;width:var(--w);background:var(--c);border-radius:3px}
/* тренировки */
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:38px;padding:0 16px;border-radius:19px;background:var(--s2);border:1px solid var(--ln);color:var(--mu);font-weight:600}
.seg button.on{background:var(--tx);color:#000;border-color:var(--tx)}
.seg.sm button{height:32px;font-size:13px;padding:0 12px}
.whd{margin:18px 0 12px}
.whd h2{margin:0 0 4px;font-size:21px}
.warm{font-size:13.5px;color:var(--mu);margin:12px 0 14px;padding-left:12px;border-left:2px solid var(--ln)}
.live{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,77,79,.1);border:1px solid rgba(255,77,79,.35)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.live span{flex:1;font-size:14px}
.live b{font:700 15px var(--fd)}
.ex{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:10px}
.ss{border-left:3px solid var(--yel);padding-left:10px;margin:16px 0 10px}
.ss-h{font-size:13px;color:var(--yel);font-weight:700;margin:0 0 8px}
.exh{display:flex;gap:12px;align-items:flex-start}
.exh .no{font:700 12px var(--fd);width:28px;height:28px;border-radius:50%;background:var(--s3);display:grid;place-items:center;flex:none;margin-top:1px}
.exh h3{margin:0;font-size:16.5px;font-weight:700;line-height:1.25}
.exh p{margin:2px 0 0;color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:rgba(255,197,61,.14);color:var(--yel);margin-left:4px;vertical-align:1px}
.vpr{margin:10px 0 0;font-size:13.5px;color:#c9c9cd}
.xnote{margin:6px 0 0;font-size:12.5px;color:var(--mu)}
.hint{margin:6px 0 0;font-size:13px;font-weight:600}
.hint.up{color:var(--grn)}.hint.hold{color:var(--yel)}
.alt-on{margin:8px 0 0;font-size:13px;color:var(--cy)}
.exb{display:flex;gap:6px;margin-top:12px}
.exb button{flex:1;height:36px;border-radius:10px;background:var(--s2);border:1px solid var(--ln);font-size:13px;font-weight:600;color:#d6d6da}
.exb button.on{border-color:#8b8b92;color:#fff}
.more{margin-top:10px;padding:12px;border-radius:12px;background:var(--s2);font-size:13.5px}
.more ul{margin:0 0 8px;padding-left:18px}
.more li{margin:3px 0}
.more a{color:var(--cy);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.chips span{padding:7px 11px;border-radius:12px;background:var(--s3);font-size:13px;font-weight:600}
.sets{margin-top:12px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:8px;align-items:center}
.set .n{color:var(--mu);font:600 12px var(--fd);text-align:center}
.fld{position:relative;display:block}
.fld input{width:100%;height:44px;border-radius:12px;background:var(--s2);border:1px solid var(--ln);padding:0 40px 0 12px;font:600 16px var(--fb);outline:none}
.fld input:focus{border-color:#77777f}
.fld input::placeholder{color:#55555c}
.fld span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:12px;pointer-events:none}
.okb{width:44px;height:44px;border-radius:12px;background:var(--s2);border:1px solid var(--ln);display:grid;place-items:center;color:var(--dim)}
.okb.on{background:var(--grn);border-color:var(--grn);color:#000}
.set.ok input{border-color:rgba(47,210,122,.5)}
.addset{margin-top:6px;height:34px;color:var(--mu);font-weight:600;font-size:13.5px}
.note{width:100%;margin-top:6px;height:40px;border-radius:10px;background:transparent;border:1px dashed var(--ln);padding:0 12px;font-size:16px;outline:none}
.hi{padding:10px 0;border-top:1px solid var(--ln)}
.hi b{font-weight:700}
.hi small{color:var(--mu);margin-left:6px}
.hi p{margin:4px 0 0;font-size:14px;color:#d0d0d4}
.sess{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--ln);font-size:14px}
.sess span{color:var(--mu)}
/* таймер отдыха */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:min(528px,calc(100% - 24px));background:#17171a;border:1px solid #34343a;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 40px rgba(0,0,0,.7)}
.rest small{display:block;color:var(--mu);font-size:12px}
.rest b{font:800 22px/1.1 var(--fd);display:block;min-width:74px}
.rest.done b{color:var(--grn)}
.rest .pr{display:flex;gap:4px;margin-left:auto}
.rest .pr button{height:34px;min-width:34px;padding:0 8px;border-radius:10px;background:var(--s3);font-size:12.5px;font-weight:600}
/* питание */
.mac{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mc{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:10px 9px}
.mc small{display:block;color:var(--mu);font-size:11.5px}
.mc b{font:700 15px/1.25 var(--fd)}
.mc em{font-style:normal;color:var(--mu);font-size:11.5px;display:block}
.mc i{display:block;height:4px;border-radius:2px;background:var(--s3);margin-top:8px;overflow:hidden}
.mc i::after{content:"";display:block;height:100%;width:var(--w);background:var(--c)}
.meal{border-top:1px solid var(--ln);padding:16px 0}
.meal-h{display:flex;align-items:center;gap:8px}
.meal-h b{font:700 15px var(--fd)}
.meal-h small{color:var(--mu)}
.meal-h .pill{margin-left:auto}
.vars{display:flex;gap:6px;margin:10px 0 8px;flex-wrap:wrap}
.vars button{height:34px;padding:0 12px;border-radius:17px;background:var(--s2);border:1px solid var(--ln);font-size:13px;font-weight:600;color:var(--mu)}
.vars button.on{border-color:var(--tx);color:var(--tx)}
.vn{font-weight:600;margin:0 0 4px}
.ing{margin:0;padding:0;list-style:none;font-size:14px}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:#d4d4d8}
.ing li span:last-child{color:var(--mu);white-space:nowrap}
.mline{margin:8px 0 0;font-size:13px;color:var(--mu)}
.mline b{color:var(--tx);font-weight:600}
.pill{height:32px;padding:0 12px;border-radius:16px;background:var(--s2);border:1px solid var(--ln);font-size:13px;font-weight:600;color:var(--mu)}
.pill.on{background:var(--grn);border-color:var(--grn);color:#000}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.calc label{display:block;margin-top:10px}
.calc label small,.form label small{display:block;color:var(--mu);font-size:12px;margin-bottom:4px}
.inp{width:100%;height:46px;border-radius:12px;background:var(--s2);border:1px solid var(--ln);padding:0 12px;font:600 16px var(--fb);outline:none}
.calc .btn{margin-top:14px}
.tgt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;text-align:center}
.tgt b{display:block;font:700 16px var(--fd)}
.tgt small{color:var(--mu);font-size:11.5px}
.shop label{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--ln);cursor:pointer}
.shop input{width:20px;height:20px;accent-color:var(--grn);flex:none}
.shop label.done span{color:var(--dim);text-decoration:line-through}
.shop small{margin-left:auto;color:var(--mu);white-space:nowrap}
.shop .grp{font-weight:700;margin:14px 0 4px;font-size:14px}
.wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t td,.t th{padding:9px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
.t th{color:var(--mu);font-weight:600;font-size:12.5px}
.t td:last-child,.t th:last-child{text-align:right;white-space:nowrap}
.cheap{color:var(--grn)}.mid{color:var(--yel)}
/* прогресс */
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.legend{font-size:12px;color:var(--mu);margin:4px 0 0;display:flex;gap:14px;align-items:center}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.st small{display:block;color:var(--mu);font-size:11.5px}
.st b{font:700 15px var(--fd)}
.msg{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--s2);font-size:14px;border-left:3px solid var(--c,var(--mu))}
.wl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--ln);font-size:14px}
.wl span{color:var(--mu)}
.wl button{color:var(--dim);font-size:13px;padding:4px 8px}
.empty{padding:20px 14px;text-align:center;color:var(--mu);font-size:14px;border:1px dashed var(--ln);border-radius:14px;margin-top:10px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph button{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--s2);border:1px solid var(--ln);position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph small{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.65);padding:2px 6px;border-radius:6px}
.ph .add{display:grid;place-items:center;color:var(--mu);font-size:14px;font-weight:600}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cmp figure{margin:0}
.cmp img{width:100%;border-radius:12px;display:block}
.cmp figcaption{font-size:12px;color:var(--mu);margin-top:4px;text-align:center}
.big-img{width:100%;border-radius:14px;display:block}
/* правила */
.rule{border-radius:20px;padding:16px;background:var(--s1);border:1px solid var(--ln);margin-top:12px}
.rule h3{font:800 17px var(--fd);margin:0 0 6px;color:var(--c)}
.ri{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}
.ri:first-of-type{border-top:0}
.ri .k{width:24px;height:24px;border-radius:50%;border:4px solid var(--c);flex:none;margin-top:1px}
.ri b{display:block;font-weight:600}
.ri small{color:var(--mu);font-size:13px}
.call{margin-top:12px;padding:14px;border-radius:16px;background:rgba(61,139,255,.08);border:1px solid rgba(61,139,255,.35);font-size:14px}
.call b{display:block;margin-bottom:4px}
details.kb{border-top:1px solid var(--ln)}
details.kb summary{list-style:none;padding:14px 0;font-weight:600;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
details.kb summary::-webkit-details-marker{display:none}
details.kb summary::after{content:"+";color:var(--mu);font-size:20px;line-height:1}
details.kb[open] summary::after{content:"–"}
details.kb div{padding:0 0 14px;color:#cfcfd4;font-size:14.5px}
details.kb p{margin:0 0 8px}
/* нижнее меню */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(8,8,9,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--dim);font-size:11px;font-weight:600}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--tx)}
.tab.on svg{color:var(--red)}
/* шторка */
.sheet{position:fixed;inset:0;z-index:50}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;display:flex;flex-direction:column;background:#111113;border:1px solid var(--ln);border-bottom:0;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px}
.sh-h b{font:700 16px/1.25 var(--fd)}
.x{width:34px;height:34px;border-radius:50%;background:var(--s3);font-size:14px;flex:none}
.sh-b{overflow:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;line-height:1.45}
.bub.me{align-self:flex-end;background:var(--tx);color:#000;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--s2);border:1px solid var(--ln);border-bottom-left-radius:4px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.sugg button{padding:7px 11px;border-radius:14px;background:var(--s2);border:1px solid var(--ln);font-size:13px;color:#cfcfd4;text-align:left}
.ask{display:flex;gap:8px;padding:10px 16px 12px;border-top:1px solid var(--ln)}
.ask textarea{flex:1;min-height:44px;max-height:120px;resize:none;border-radius:12px;background:var(--s2);border:1px solid var(--ln);padding:11px 12px;font-size:16px;outline:none}
.ask .btn{height:44px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-16px);opacity:0;z-index:60;background:var(--tx);color:#000;font-weight:600;padding:10px 16px;border-radius:14px;transition:.25s;pointer-events:none;width:max-content;max-width:90%;text-align:center;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.mac{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}

/* v2: звёздное небо */
#sky{position:fixed;left:0;top:0;width:100%;height:100vh;z-index:0;pointer-events:none;display:block}
.app{position:relative;z-index:1}
input[type=search]{-webkit-appearance:none;appearance:none}
/* v2: переходы между экранами */
.scr.on.from-r{animation:inR .42s cubic-bezier(.2,.8,.2,1)}
.scr.on.from-l{animation:inL .42s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{opacity:0;transform:translateX(26px)}}
@keyframes inL{from{opacity:0;transform:translateX(-26px)}}
/* v2: плавное появление блоков */
.rv{opacity:0;transform:translateY(14px);transition:opacity .55s ease var(--d,0ms),transform .55s cubic-bezier(.2,.8,.2,1) var(--d,0ms)}
.rv.vis{opacity:1;transform:none}
/* v2: мелкие детали */
button{transition:transform .15s ease,background-color .25s,border-color .25s,color .25s}
button:active:not(:disabled){transform:scale(.96)}
.frow:active:not(:disabled){transform:none;background:var(--s2)}
.tg.just::after{animation:knobOn .32s cubic-bezier(.3,1.5,.5,1)}
.tg.just:not(.on)::after{animation:knobOff .28s ease}
@keyframes knobOn{from{transform:translateX(0)}}
@keyframes knobOff{from{transform:translateX(20px)}}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.72)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.okb.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1),ring .7s ease-out}
@keyframes ring{from{box-shadow:0 0 0 0 rgba(47,210,122,.55)}to{box-shadow:0 0 0 14px rgba(47,210,122,0)}}
.bump{animation:bump .3s ease}
@keyframes bump{50%{transform:scale(1.22)}}
.hr.justok .dot{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.arc.flash{animation:flash .7s ease}
@keyframes flash{40%{stroke-width:28}}
.anim-in .arc{animation:draw 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*90ms + 120ms)}
.anim-in .week .p{animation:draw 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*60ms + 250ms)}
@keyframes draw{from{stroke-dasharray:0 600}}
.anim-in .mc i::after,.anim-in .bar i::after{animation:grow 1s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes grow{from{width:0}}
.set.rm{animation:rm .2s ease forwards}
@keyframes rm{to{opacity:0;transform:translateX(30px)}}
.set.new{animation:rise .32s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
details.kb[open] div,.more{animation:rise .32s ease}
.tabs .in{position:relative}
.tab-ind{position:absolute;top:-7px;left:0;width:20%;height:3px;display:flex;justify-content:center;transform:translateX(calc(var(--ti,0)*100%));transition:transform .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tab-ind::after{content:"";width:30px;height:3px;border-radius:3px;background:var(--red);box-shadow:0 0 12px rgba(255,77,79,.7)}
.tab.on svg{animation:tabpop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabpop{50%{transform:translateY(-3px) scale(1.1)}}
.rest .rb{position:absolute;left:14px;right:14px;bottom:5px;height:2px;border-radius:2px;background:var(--s3);overflow:hidden}
.rest .rb i{display:block;height:100%;background:var(--grn);transform-origin:left center;transition:transform .25s linear}
.sh-bg{animation:fadeIn .25s ease}
.sheet.closing .sh{animation:down .2s ease forwards}
.sheet.closing .sh-bg{animation:fadeOut .2s ease forwards}
@keyframes down{to{transform:translateY(40px);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.hero .plate{filter:drop-shadow(0 0 22px rgba(255,77,79,.12))}
/* v2: подходы, свои замены, справочник продуктов */
.setbtns{display:flex;gap:18px;flex-wrap:wrap}
.calt{display:flex;gap:8px;margin-top:10px}
.calt .inp{height:38px}
.chips .my{outline:1px dashed #66666e}
.fcat{margin:10px 0 0}
.fhead,.frow{display:grid;grid-template-columns:1fr 44px 38px 38px 38px;gap:4px;align-items:center}
.fhead{font-size:12px;color:var(--mu);padding:0 0 8px}
.fhead span:not(:first-child),.frow span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.frow{width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--ln);font-size:13.5px}
.frow span:not(:first-child){color:#cfcfd4}
.frow small{display:block;color:var(--mu);font-size:11.5px}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}

const pd=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};

const fmt=(n,d=0)=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:d});

const LS='relief.v1';
const CORE=['v','u','start','prof','days','weights','shop','notes','cur','calt'];
const defaults=()=>({v:1,u:0,lu:0,start:dk(),prof:{age:16,h:188,w:89,act:1.55,mode:'cut',rest:90},days:{},weights:[],shop:{},notes:{},calt:{},cur:null,log:[]});
function load(){try{const j=JSON.parse(localStorage.getItem(LS));if(j&&j.v===1){const d=defaults();return Object.assign(d,j,{prof:Object.assign(d.prof,j.prof||{})})}}catch(e){}return defaults()}
let S=load();
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function save(kind){const t=Date.now();if(kind==='log')S.lu=t;else S.u=t;persist();Cloud.mark(kind==='log'?'log':'core')}
let saveT;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>save(),700)}

const Cloud={db:null,uid:null,on:false,dirty:new Set(),timer:null,busy:false,
 async init(){
  try{
   if(!window.claude||typeof window.claude.use!=='function')return;
   const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
   if(!db||!user)return;
   const uid=await user.id();if(!uid)return;
   this.db=db;this.uid=uid;
   const [c,l]=await Promise.all([this.ref('core').get(),this.ref('log').get()]);
   const rc=c.exists?JSON.parse(JSON.stringify(c.data())):null, rl=l.exists?JSON.parse(JSON.stringify(l.data())):null;
   let changed=false;
   if(rc&&(rc.u||0)>(S.u||0)){CORE.forEach(k=>{if(k in rc)S[k]=rc[k]});S.prof=Object.assign(defaults().prof,S.prof||{});changed=true}
   else if((S.u||0)>((rc&&rc.u)||0))this.dirty.add('core');
   if(rl&&(rl.lu||0)>(S.lu||0)){S.log=Array.isArray(rl.log)?rl.log:[];S.lu=rl.lu;changed=true}
   else if((S.lu||0)>((rl&&rl.lu)||0))this.dirty.add('log');
   if(changed){persist();renderCurrent()}
   this.on=true;setSync();this.flush();
  }catch(e){this.db=null;this.on=false;setSync()}
 },
 ref(k){return this.db.doc('data/users/'+this.uid+'/'+k)},
 mark(k){if(!this.db)return;this.dirty.add(k);clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),1500)},
 async flush(){
  if(!this.db||this.busy||!this.dirty.size)return;this.busy=true;
  try{
   for(const k of [...this.dirty]){
    this.dirty.delete(k);
    const body=k==='log'?{lu:S.lu,log:S.log}:Object.fromEntries(CORE.map(x=>[x,S[x]]));
    try{await this.ref(k).set(JSON.parse(JSON.stringify(body)));this.on=true}
    catch(e){this.dirty.add(k);this.on=false;if(e&&['revoked','not_granted','capability_disabled','capability_removed'].includes(e.code))this.db=null;break}
   }
  }finally{this.busy=false;setSync();if(this.dirty.size&&this.db){clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),8000)}}
 }
};

function targets(){
 const p=S.prof,bmr=10*p.w+6.25*p.h-5*p.age+5,tdee=bmr*p.act,mult={keep:1,soft:.9,cut:.85}[p.mode]||.85;
 let k=Math.round(tdee*mult/50)*50;const floor=p.age<18?2400:Math.round(bmr*1.2/50)*50;k=Math.max(k,floor);
 const pr=Math.round(p.w*2/5)*5,f=Math.round(p.w*.9/5)*5,c=Math.max(0,Math.round((k-pr*4-f*9)/4/5)*5);
 return{bmr:Math.round(bmr),tdee:Math.round(tdee),k,p:pr,f,c};
}
function macro(items){const t={k:0,p:0,f:0,c:0};for(const [id,g] of items){const x=FOOD[id];t.k+=x[1]*g/100;t.p+=x[2]*g/100;t.f+=x[3]*g/100;t.c+=x[4]*g/100}return t}
const day=k=>S.days[k]||(S.days[k]={});
const selV=(k,m)=>(S.days[k]&&S.days[k].m&&S.days[k].m[m])||'A';
function sumMeals(k,onlyEaten){const d=S.days[k]||{},t={k:0,p:0,f:0,c:0};MEALS.forEach(M=>{if(onlyEaten&&!(d.e&&d.e[M.id]))return;const m=macro(M.v[selV(k,M.id)].i);for(const x in t)t[x]+=m[x]});for(const x in t)t[x]=Math.round(t[x]);return t}
const wOf=k=>{const g=pd(k).getDay();return['tue','thu','sat'].find(x=>DAYS[x].dow===g)||null};
function nextW(){const t=new Date();for(let i=1;i<=7;i++){const d=new Date(t);d.setDate(t.getDate()+i);const w=wOf(dk(d));if(w)return{w,d:dk(d)}}}
const habits=k=>HB.filter(h=>h.id!=='wo'||wOf(k));
function done(k,id){const d=S.days[k]||{};if(id==='wa')return(d.wa||0)>=10;if(id==='wo')return S.log.some(s=>s.d===k);if(id==='pr')return!!d.pr||sumMeals(k,true).p>=targets().p*.95;return!!d[id]}
const score=k=>{const l=habits(k);return l.filter(h=>done(k,h.id)).length/l.length};
function streak(){let c=0;const t=new Date();for(let i=0;i<400;i++){const d=new Date(t);d.setDate(t.getDate()-i);if(score(dk(d))>=.8)c++;else if(i===0)continue;else break}return c}
function lastOf(id){for(let i=S.log.length-1;i>=0;i--){const x=S.log[i].x&&S.log[i].x[id];if(x&&x.s&&x.s.length)return{d:S.log[i].d,s:x.s,a:x.a}}return null}

function chartSVG(W){
 if(W.length<2)return`<div class="empty">Добавь минимум два замера — появится график.</div>`;
 const w=340,h=170,pl=30,pr=10,pt=10,pb=22,t=W.map(e=>pd(e.d).getTime()),v=W.map(e=>e.w);
 const x0=t[0],x1=t[t.length-1],lo=Math.floor(Math.min(...v)-.5),hi=Math.ceil(Math.max(...v)+.5);
 const X=a=>pl+(w-pl-pr)*((a-x0)/((x1-x0)||1)),Y=a=>pt+(h-pt-pb)*(1-(a-lo)/((hi-lo)||1));
 const avg=W.map((e,i)=>{const g=W.filter((q,j)=>t[j]>=t[i]-6*864e5&&t[j]<=t[i]);return g.reduce((a,q)=>a+q.w,0)/g.length});
 const path=a=>a.map((y,i)=>`${i?'L':'M'}${X(t[i]).toFixed(1)},${Y(y).toFixed(1)}`).join('');
 const step=hi-lo>6?2:1;let grid='';for(let y=lo;y<=hi;y+=step)grid+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(y).toFixed(1)}" y2="${Y(y).toFixed(1)}" stroke="#1f1f23"/><text x="${pl-6}" y="${(Y(y)+4).toFixed(1)}" fill="#6b6b72" font-size="10" text-anchor="end">${y}</text>`;
 const lab=(k,a)=>`<text x="${a==='end'?w-pr:pl}" y="${h-4}" fill="#6b6b72" font-size="10" text-anchor="${a}">${fdate(k,{day:'numeric',month:'short'})}</text>`;
 return`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="График веса">${grid}<path d="${path(v)}" fill="none" stroke="#4a4a50" stroke-width="1.5"/>${W.map((e,i)=>`<circle cx="${X(t[i]).toFixed(1)}" cy="${Y(e.w).toFixed(1)}" r="2.6" fill="#8b8b92"/>`).join('')}<path d="${path(avg)}" fill="none" stroke="${CL.grn}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>${lab(W[0].d,'start')}${lab(W[W.length-1].d,'end')}</svg><p class="legend"><span><i style="background:#8b8b92"></i>замеры</span><span><i style="background:${CL.grn}"></i>среднее за 7 дней</span></p>`;
}
function pace(W){if(W.length<2)return null;const last=W[W.length-1],lt=pd(last.d).getTime();const from=W.find(e=>pd(e.d).getTime()>=lt-21*864e5)||W[0];const days=(lt-pd(from.d).getTime())/864e5;if(days<6)return null;return(last.w-from.w)/days*7}

 open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('relief-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},

 all(){return this.tx('readonly',s=>s.getAll())},put(o){return this.tx('readwrite',s=>s.put(o))},del(id){return this.tx('readwrite',s=>s.delete(id))}};

function compress(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',.82)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}

 $('#s-rules').innerHTML=`<h1>Правила</h1><p class="sub">Твоя памятка «Для справки» — всегда под рукой.</p>
 <div class="rule" style="--c:${CL.red}"><h3>Запрещено</h3>${it(RULES.no,CL.red)}</div>
 <div class="rule" style="--c:${CL.grn}"><h3>Обязательно</h3>${it(RULES.yes,CL.grn)}</div>
 <div class="call"><b>Фишка из видео</b>Не нужно жить в зале и сидеть на жёсткой диете. Готовая программа, 3 тренировки в неделю, меню с посчитанными граммами и калориями — и просто делать это каждую неделю.</div>
 <h2>База знаний</h2>${KB.map(([t,ps])=>`<details class="kb"><summary>${t}</summary><div>${ps.map(p=>`<p>${p}</p>`).join('')}</div></details>`).join('')}
 <p class="mline" style="margin-top:18px">Если кружится голова, нет сил, болят суставы или что-то беспокоит — покажись врачу. Здоровье важнее цифр на весах.</p>`;
}

/* ---------- шторка ---------- */
let lastFocus=null;
function openSheet(t,body,foot=''){lastFocus=document.activeElement;$('#shT').textContent=t;$('#shB').innerHTML=body;$('#shF').innerHTML=foot;$('#sheet').classList.remove('closing');$('#sheet').hidden=false;document.body.style.overflow='hidden';setTimeout(()=>{const x=$('#sheet .x');x&&x.focus()},30)}
function closeSheet(){if(AI.ctl)AI.ctl.abort();const s=$('#sheet');if(s.hidden)return;const fin=()=>{s.hidden=true;s.classList.remove('closing');document.body.style.overflow='';lastFocus&&lastFocus.focus&&lastFocus.focus()};if(RM){fin();return}s.classList.add('closing');setTimeout(fin,190)}
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* ---------- AI-тренер (если доступен) ---------- */
const AI={fn:null,turns:[],ctl:null};
async function initAI(){try{if(!window.claude||typeof window.claude.use!=='function')return;const s=await claude.use('sample');if(!s)return;AI.fn=s;$('#aiOpen').classList.add('show')}catch(e){}}
function aiRules(){const T=targets(),p=S.prof;return`Ты — AI-тренер внутри личного фитнес-приложения «Рельеф». Отвечай по-русски, дружелюбно и просто, как старший товарищ по залу, без жёсткого сленга. Коротко: до 120 слов, по делу, списком где уместно.
О пользователе: парень ${p.age} лет, рост ${p.h} см, вес ${p.w} кг, в зале 4 года, цель — убрать лишний жир и сохранить мышцы. Живёт в Беларуси, закупается в сети «Санта» — советуй только обычные доступные продукты (курица, яйца, творог, кефир, минтай, хек, тунец, гречка, рис, овсянка, картофель, овощи, фрукты).
Его норма: ${T.k} ккал, белок ${T.p} г, жиры ${T.f} г, углеводы ${T.c} г. Тренировки: вторник (спина, грудь, руки), четверг (ноги, плечи), суббота (спина, руки). Его правила: минимум сладкого и мучного, 10 000 шагов, вода, сон 8+ часов.
Безопасность: ему ${p.age} — никаких жёстких диет и голоданий, дефицита больше 15%, калорий ниже 2400, жиросжигателей, мочегонных, стероидов и любой фармы. Не поощряй чувство вины за еду. При боли, травмах, головокружении и любых проблемах со здоровьем советуй врача. Если не уверен — так и скажи.`}
const bub=m=>`<div class="bub ${m.role==='user'?'me':'ai'}">${esc(m.content)}</div>`;
function openAI(){openSheet('AI-тренер',`<div class="chat" id="chat">${AI.turns.length?AI.turns.map(bub).join(''):'<p class="mu" style="margin:0">Спроси про еду, замены продуктов или упражнения. Отвечает Claude, ответы тратят лимиты твоего аккаунта.</p>'}</div><div class="sugg">${SUGG.map(q=>`<button data-a="aiq">${esc(q)}</button>`).join('')}</div>`,`<div class="ask"><textarea id="aiIn" rows="1" placeholder="Напиши вопрос" aria-label="Вопрос AI-тренеру"></textarea><button class="btn sm" data-a="aisend" id="aiBtn">Спросить</button></div>`)}
const scrollChat=()=>{const b=$('#shB');b&&(b.scrollTop=b.scrollHeight)};
async function aiSend(q){
 if(AI.ctl){AI.ctl.abort();return}q=(q||'').trim();if(!q||!AI.fn)return;
 AI.turns.push({role:'user',content:q});const chat=$('#chat');if(!chat)return;
 if(!chat.querySelector('.bub'))chat.innerHTML='';
 chat.insertAdjacentHTML('beforeend',bub({role:'user',content:q})+'<div class="bub ai" id="aiOut">Думаю…</div>');const inp=$('#aiIn');if(inp)inp.value='';scrollChat();
 AI.ctl=new AbortController();const btn=$('#aiBtn');if(btn)btn.textContent='Стоп';
 try{const r=await AI.fn([{role:'user',content:aiRules()},...AI.turns.slice(-12)],{cache:false,signal:AI.ctl.signal,onText:({text})=>{const o=$('#aiOut');if(o)o.textContent=text;scrollChat()}});
  AI.turns.push({role:'assistant',content:r.text});const o=$('#aiOut');if(o){o.textContent=r.text;o.removeAttribute('id')}}
 catch(e){const c=e&&e.code,o=$('#aiOut'),keep=c==='refused'?'':(e&&e.text)||'';
  const msg={not_granted:'Доступ к AI не разрешён, функция выключена.',sampling_disabled:'AI недоступен для этого аккаунта.',rate_limited:'Слишком много вопросов подряд или закончились лимиты. Попробуй позже.',session_expired:'Нужно заново войти в Claude.',refused:'На такой вопрос ответить не получится, переформулируй.',cancelled:'Остановлено.'}[c]||'Не получилось ответить. Попробуй ещё раз.';
  if(o){o.textContent=(keep?keep+'\n\n':'')+msg;o.removeAttribute('id')}if(keep)AI.turns.push({role:'assistant',content:keep});
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){AI.fn=null;$('#aiOpen').classList.remove('show')}}
 finally{AI.ctl=null;const b=$('#aiBtn');if(b)b.textContent='Спросить';scrollChat()}
}

/* ---------- действия ---------- */
const ACT={
 go:b=>go(b.dataset.go),
 gotrain:b=>{WSEL=b.dataset.w;go('train')},
 hb:b=>{const d=day(dk()),h=b.dataset.h;d[h]=d[h]||done(dk(),h)?0:1;if(h==='pr'&&!d.pr&&done(dk(),'pr'))toast('Белок уже закрыт по отмеченной еде');save();renderToday();after('.tg[data-h="'+h+'"]','just')},
 wa:b=>{const d=day(dk());d.wa=Math.max(0,Math.min(16,(d.wa||0)+ +b.dataset.d));save();renderToday();after('.cnt output','bump')},
 wsel:b=>{WSEL=b.dataset.w;renderTrain();scrollTo(0,0);const sc=$('#s-train');sc.classList.remove('from-r','from-l');void sc.offsetWidth;if(!RM)sc.classList.add('from-r');reveal()},
 start:()=>{if(ensureCur())renderTrain()},
 cancel:()=>{S.cur=null;unwake();stopRest();save();renderTrain();toast('Тренировка сброшена')},
 finish:()=>finish(),
 tech:b=>{const k=b.dataset.ex+':t';OPEN.has(k)?OPEN.delete(k):OPEN.add(k);renderTrain()},
 alts:b=>{const k=b.dataset.ex+':a';OPEN.has(k)?OPEN.delete(k):OPEN.add(k);renderTrain()},
 alt:b=>{const id=b.dataset.ex;if(!ensureCur(id))return;S.cur.x[id].a=b.dataset.v;OPEN.delete(id+':a');save();renderTrain();toast('Замена: '+b.dataset.v)},
 alt0:b=>{const id=b.dataset.ex;if(S.cur&&S.cur.x[id]){delete S.cur.x[id].a;save();renderTrain()}},
 hist:b=>showHist(b.dataset.ex),
 addset:b=>{const id=b.dataset.ex;if(!ensureCur(id))return;S.cur.x[id].s.push({});save();renderTrain();after('#ex-'+id+' .set:last-child','new')},
 delset:b=>{const id=b.dataset.ex;if(!ensureCur(id))return;const s=S.cur.x[id].s;if(s.length<=1)return;const rows=document.querySelectorAll('#ex-'+id+' .set'),lr=rows[rows.length-1],fin=()=>{s.pop();save();renderTrain()};if(lr&&!RM){lr.classList.add('rm');setTimeout(fin,200)}else fin()},
 altc:b=>{const id=b.dataset.ex,v=(($('#ca-'+id)||{}).value||'').trim().slice(0,60);if(!v){toast('Впиши название упражнения');return}if(!ensureCur(id))return;S.calt=S.calt||{};S.calt[id]=[v,...(S.calt[id]||[]).filter(x=>x!==v)].slice(0,8);S.cur.x[id].a=v;OPEN.delete(id+':a');save();renderTrain();toast('Замена: '+v)},
 ok:b=>{const row=b.closest('.set'),id=row.dataset.ex,i=+row.dataset.i;if(!ensureCur(id))return;const o=S.cur.x[id];o.s[i]=o.s[i]||{};const v=o.s[i];
  if(v.ok){v.ok=0}else{const [wi,ri]=row.querySelectorAll('input');if(!String(v.w??'').trim()&&wi.placeholder)v.w=wi.placeholder;if(!String(v.r??'').trim()&&ri.placeholder)v.r=ri.placeholder;
   if(num(v.w)==null||!num(v.r)){toast('Впиши вес и повторы');return}v.ok=1;startRest();after('#ex-'+id+' .set[data-i="'+i+'"] .okb','pop')}save();renderTrain()},
 rest:b=>startRest(+b.dataset.s),
 restp:()=>{R.end+=15000;R.dur+=15000;$('#rest').classList.remove('done');$('#restL').textContent='Отдых';clearInterval(R.iv);R.iv=setInterval(tickRest,250);tickRest()},
 restx:()=>stopRest(),
 eat:b=>{const d=day(dk());d.e=d.e||{};d.e[b.dataset.m]=d.e[b.dataset.m]?0:1;save();renderFood();after('[data-a="eat"][data-m="'+b.dataset.m+'"]','pop')},
 var:b=>{const d=day(dk());d.m=d.m||{};d.m[b.dataset.m]=b.dataset.v;save();renderFood();after('[data-a="var"][data-m="'+b.dataset.m+'"][data-v="'+b.dataset.v+'"]','pop')},
 fcat:b=>{FCAT=+b.dataset.c;document.querySelectorAll('.fcat button').forEach(x=>x.classList.toggle('on',x===b));filterFoods()},
 food:b=>{const id=b.dataset.id,f=FOOD[id];openSheet(f[0],`<label style="display:block"><small class="mu" style="display:block;margin-bottom:6px">Сколько грамм${FNOTE[id]?', '+FNOTE[id]:''}</small><input class="inp" id="gIn" inputmode="decimal" value="100" data-id="${id}"></label><div class="tgt" id="gOut"></div><p class="mline">${f[5]===3&&id!=='pot'&&id!=='bean'?'Крупы и макароны — вес в сухом виде.':f[5]<2?'Мясо и рыба — вес в сыром виде.':'Средние значения, на упаковке может немного отличаться.'}</p>`);portion()},
 calc:()=>{const w=num($('#cW').value),h=num($('#cH').value),a=num($('#cA').value);
  if(!(w>=40&&w<=200)||!(h>=140&&h<=220)||!(a>=12&&a<=80)){toast('Проверь вес, рост и возраст');return}
  Object.assign(S.prof,{w,h,age:Math.round(a),act:+$('#cAct').value,mode:$('#cMode').value});save();renderFood();toast('Норма: '+fmt(targets().k)+' ккал')},
 shopclr:()=>{S.shop={};save();renderFood()},
 wsave:()=>{const w=num($('#pW').value),wa=num($('#pWa').value);if(!(w>=40&&w<=200)){toast('Впиши вес, например 88,6');return}
  if(wa!=null&&!(wa>=50&&wa<=160)){toast('Талия выглядит странно, проверь');return}
  const k=dk();S.weights=S.weights.filter(e=>e.d!==k);S.weights.push(wa!=null?{d:k,w,wa}:{d:k,w});S.weights.sort((a,b)=>a.d<b.d?-1:1);S.prof.w=S.weights[S.weights.length-1].w;save();renderProg();toast('Замер сохранён, норма: '+fmt(targets().k)+' ккал')},
 wdel:b=>{S.weights=S.weights.filter(e=>e.d!==b.dataset.d);if(S.weights.length)S.prof.w=S.weights[S.weights.length-1].w;save();renderProg()},
 padd:()=>$('#photoIn').click(),
 pview:async b=>{const id=+b.dataset.id;let L=[];try{L=await PDB.all()}catch(e){}const p=L.find(x=>x.id===id);if(!p)return;const u=URL.createObjectURL(p.b);URLS.push(u);openSheet(fdate(p.d,{day:'numeric',month:'long',year:'numeric'}),`<img class="big-img" src="${u}" alt="Фото прогресса"><button class="btn ghost w" data-a="pdel" data-id="${id}" style="margin-top:12px">Удалить фото</button>`)},
 pdel:async b=>{try{await PDB.del(+b.dataset.id)}catch(e){}closeSheet();renderPhotos()},
 exp:()=>{try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='relief-backup-'+dk()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Копия сохранена в загрузки')}catch(e){toast('Не получилось сохранить копию')}},
 imp:()=>$('#bakIn').click(),
 ai:()=>openAI(),
 aiq:b=>{const i=$('#aiIn');if(i)i.value=b.textContent;aiSend(b.textContent)},
 aisend:()=>{const i=$('#aiIn');aiSend(i?i.value:'')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-t],[data-close]');if(!b||b.disabled)return;
 if(b.hasAttribute('data-close')){closeSheet();return}if(b.dataset.t){go(b.dataset.t);return}const f=ACT[b.dataset.a];if(f)f(b,e)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='fq'){FQ=t.value;filterFoods();return}if(t.id==='gIn'){portion();return}
 if(t.matches('.set input')){const row=t.closest('.set'),id=row.dataset.ex,i=+row.dataset.i;if(!ensureCur(id))return;const o=S.cur.x[id];o.s[i]=o.s[i]||{};o.s[i][t.dataset.f]=t.value;saveSoon()}
 else if(t.matches('.note')){S.notes[t.dataset.ex]=t.value;saveSoon()}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset&&t.dataset.shop){S.shop[t.dataset.shop]=t.checked?1:0;t.closest('label').classList.toggle('done',t.checked);save()}
 if(t.id==='bakIn'&&t.files&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!j||j.v!==1||typeof j.days!=='object'||!Array.isArray(j.log))throw 0;const d=defaults();S=Object.assign(d,j,{prof:Object.assign(d.prof,j.prof||{})});persist();renderCurrent();toast('Данные восстановлены')}catch(err){toast('Это не файл копии «Рельефа»')}t.value=''}
 if(t.id==='photoIn'&&t.files&&t.files[0]){try{const b=await compress(t.files[0]);await PDB.put({id:Date.now(),d:dk(),b});toast('Фото сохранено на устройстве');renderPhotos()}catch(err){toast('Не удалось сохранить фото')}t.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aiIn'&&!e.shiftKey){e.preventDefault();aiSend(e.target.value)}});

/* ---------- старт ---------- */
$('#hdate').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short'});
if(S.cur)wake();
ANIM=true;$('#s-today').classList.add('anim-in');renderToday();ANIM=false;reveal();setTimeout(()=>$('#s-today').classList.remove('anim-in'),2200);setSync();Cloud.init();initAI();initSky();
if(STANDALONE){$('#sync').hidden=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()});navigator.serviceWorker.register('./sw.js').catch(()=>{})}}
